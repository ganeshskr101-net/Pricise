<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricise</title>
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="../icons/logo.svg" alt="">
    <div class="head-text">
      <div class="brand">Pricise</div>
      <div class="sub" id="status">Getting ready…</div>
    </div>
    <span class="pill info agents-pill" id="agents-pill"><span class="live-dot"></span>4 agents</span>
    <button class="icon-btn" id="recheck" title="Check this page again" aria-label="Check this page again">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
  </header>

  <main id="main">
    <!-- Filled in by panel.js -->
  </main>

  <!-- Outside <main> so live re-renders of the check never wipe the conversation. Filled in by panel.js. -->
  <section class="card ask" id="ask" hidden>
    <div class="ask-title">Ask about this page</div>
    <div class="ask-chips" id="ask-chips"></div>
    <div class="ask-thread" id="ask-thread" aria-live="polite"></div>
    <form class="ask-form" id="ask-form">
      <input id="ask-input" type="text" maxlength="300" autocomplete="off" placeholder="Ask about this page…" aria-label="Ask about this page">
      <button class="btn primary" type="submit" id="ask-send">Ask</button>
    </form>
    <div class="ask-note" id="ask-note"></div>
  </section>

  <footer class="foot">
    <span>&#128274; Analysed on this laptop · no personal data sent</span>
    <span class="foot-links"><a href="#" id="card-setting">Quick card: on</a> · <a href="#" id="open-wishlist">Wishlist</a></span>
  </footer>
  <script type="module" src="panel.js"></script>
</body>
</html>
