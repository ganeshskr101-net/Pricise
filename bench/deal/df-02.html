<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Night | Bench Store</title>
<!-- Pricise bench page: a MADE-UP store. Label in bench/labels.csv. -->
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "Product", "name": "Hotel Night", "sku": "BENCH-DF-02", "offers": {"@type": "Offer", "price": "120.00", "priceCurrency": "USD"}}</script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}.top{background:#2d3748;color:#fff;padding:12px 20px;font-weight:700}.wrap{max-width:900px;margin:20px auto;padding:0 20px}h1{font-size:22px;font-weight:500}.price{font-size:28px}.was{color:#666}.btn{display:inline-block;background:#f6c343;color:#111;border:0;border-radius:18px;padding:10px 22px;margin-top:12px;text-decoration:none;font-size:14px;cursor:pointer}.box{border:1px solid #ddd;border-radius:8px;padding:12px;margin:12px 0;font-size:14px}table{border-collapse:collapse;width:100%;max-width:420px}td{padding:6px 0;border-bottom:1px solid #eee}td.a{text-align:right}.lab{position:fixed;left:10px;bottom:10px;background:#111;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;opacity:.75}</style>
</head>
<body>
<div class="top">Bench Store</div>
<div class="wrap">
<h1 id="title">Hotel Night</h1>
<div id="product"><div class="price">$120.00</div><div>Free shipping</div><a class="btn" href="?step=1">Add to cart</a></div>
<div id="checkout"></div>
</div>
<div class="lab">Pricise bench · made-up store</div>
<script>const STEPS=[[], [["Svc. chg (non-refundable)", 9.5], ["Proc.", 3.25]]];const N=STEPS.length;const step=+new URLSearchParams(location.search).get('step')||0;
const m=(a)=>a===0?'FREE':'$'+a.toFixed(2);const box=document.getElementById('checkout');
if(step){document.body.dataset.step=step;const lines=[["Hotel Night",120.0]];STEPS.slice(0,step).forEach(s=>lines.push(...s));
const t=lines.reduce((s,[,a])=>s+a,0);const rows=lines.map(([l,a])=>`<tr data-line><td>${l}</td><td class=a>${m(a)}</td></tr>`).join('');const total=`<tr data-total><td><b>Order total</b></td><td class=a><b>${m(t)}</b></td></tr>`;
box.innerHTML=`<h2>Checkout · step ${step} of ${N}</h2>`+`<table class="summary">${rows}${total}</table>`+(step<N?`<a class="btn" href="?step=${step+1}">Continue</a>`:`<button class="btn" type="button" id="pay">Place order</button>`);
document.getElementById('product').style.display='none';}</script>
</body>
</html>
