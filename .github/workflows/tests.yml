# Runs the backend tests on every pull request (and on pushes to main). Stub mode, no secrets needed.
# Playwright's Chromium isn't installed here, so the tests that need the hidden browser skip themselves.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_DEAL: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: python -m pytest backend/tests -q -rs
